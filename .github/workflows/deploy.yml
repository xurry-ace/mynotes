name: publish-site
on:
  push:
    branches:
      - main  # 当你向 main 分支推送代码时触发
permissions:
  contents: write
concurrency:
  group: publish-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force
      
