  <text x="258" y="309" font-family="&quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#065f46" text-anchor="middle" dominant-baseline="central">E = 4 + 127 = 131</text>
