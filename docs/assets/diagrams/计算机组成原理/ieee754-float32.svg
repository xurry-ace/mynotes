  <text x="258" y="128" font-family="&quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle" dominant-baseline="central">8 位  |  真实指数 e = E - 127</text>
